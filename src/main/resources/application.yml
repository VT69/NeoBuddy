spring:
  application:
    name: neobuddy
  threads:
    virtual:
      enabled: true
  datasource:
    # No defaults on purpose: outside the local profile these must come from env / SSM.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

neobuddy:
  extraction:
    # Attachment safety limits (docs/ARCHITECTURE.md, Non-functional design).
    max-attachment-size: 25MB
    excel-streaming-threshold: 5MB
    timeout: 30s
    max-concurrent: 2

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
