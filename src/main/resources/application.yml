spring:
  application:
    name: neobuddy
  threads:
    virtual:
      enabled: true
  datasource:
    # No defaults on purpose: outside the local profile these must come from env / SSM.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

neobuddy:
  encryption:
    # AES-256 key for encrypted columns: 32 random bytes in base64 (openssl rand -base64 32).
    # Required. Losing it makes every stored channel address and refresh token unreadable.
    key: ${NEOBUDDY_ENCRYPTION_KEY:}
  bootstrap:
    # v1 seed: the first college and its admin, applied at every startup (idempotent).
    # All values come from the environment; leave the slug empty to seed nothing.
    college:
      slug: ${NEOBUDDY_BOOTSTRAP_COLLEGE_SLUG:}
      name: ${NEOBUDDY_BOOTSTRAP_COLLEGE_NAME:}
      # Comma-separated lists.
      allowed-email-domains: ${NEOBUDDY_BOOTSTRAP_COLLEGE_EMAIL_DOMAINS:}
      sender-allowlist: ${NEOBUDDY_BOOTSTRAP_COLLEGE_SENDER_ALLOWLIST:}
      # Defaults to ^[A-Z0-9]{8}$ when empty.
      neo-id-pattern: ${NEOBUDDY_BOOTSTRAP_COLLEGE_NEO_ID_PATTERN:}
    admin:
      email: ${NEOBUDDY_BOOTSTRAP_ADMIN_EMAIL:}
      neo-id: ${NEOBUDDY_BOOTSTRAP_ADMIN_NEO_ID:}
      reg-no: ${NEOBUDDY_BOOTSTRAP_ADMIN_REG_NO:}
      ntfy-topic: ${NEOBUDDY_BOOTSTRAP_ADMIN_NTFY_TOPIC:}
      personal-email: ${NEOBUDDY_BOOTSTRAP_ADMIN_PERSONAL_EMAIL:}
    source:
      # The first source inbox. Get the refresh token with: ./gradlew authorizeSource
      email: ${NEOBUDDY_BOOTSTRAP_SOURCE_EMAIL:}
      refresh-token: ${NEOBUDDY_BOOTSTRAP_SOURCE_REFRESH_TOKEN:}
  ingestion:
    # false switches the scheduled poller off.
    enabled: true
    poll-interval: PT2M
    # When a Gmail history cursor is too old, list this many days of mail and rely on dedupe.
    fallback-window-days: 7
  gmail:
    # OAuth client (type "Desktop app") of the Google Cloud project with the Gmail API enabled.
    client-id: ${NEOBUDDY_GMAIL_CLIENT_ID:}
    client-secret: ${NEOBUDDY_GMAIL_CLIENT_SECRET:}
    retry:
      # For HTTP 429 and 5xx: tries in total, and the wait before the second (doubles after).
      max-attempts: 4
      initial-backoff: 1s
  extraction:
    # Attachment safety limits (docs/ARCHITECTURE.md, Non-functional design).
    max-attachment-size: 25MB
    excel-streaming-threshold: 5MB
    timeout: 30s
    max-concurrent: 2
  matching:
    # How often each instance reloads its in-memory identifier index, as a safety net behind
    # the rebuild that every identifier change triggers.
    index-refresh: PT5M
  classifier:
    # Keywords are matched whole and case-insensitively; spaces and hyphens are interchangeable.
    # The subject is checked before the body, and OFFER before SHORTLIST. Starting set, to be
    # tuned against real placement mail. Per-college overrides go under classifier.colleges.<slug>.
    rules:
      offer:
        subject:
          - offer
          - offers
          - offered
          - offer letter
          - offer letters
          - final selection
          - final selections
          - final selects
          - final result
          - final results
          - placed
          - ppo
        body:
          - offer letter
          - offer letters
          - job offer
          - internship offer
          - pleased to offer
          - extended an offer
          - extended offers
          - received offers
          - offers from
          - final selection
          - final selects
          - finally selected
      shortlist:
        subject:
          - shortlist
          - shortlists
          - shortlisted
          - short list
          - short listed
          - interview schedule
          - interview list
          - next round
          - selected for interview
        body:
          - shortlist
          - shortlisted
          - short list
          - short listed
          - selected for the next round
          - selected for interview
          - interview schedule
    # Company names recognised anywhere in a subject line. Empty until real recruiters are known.
    known-recruiters: []

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

spring.modulith:
  events:
    # An event whose listener had not finished when the application stopped is delivered again
    # at the next start, so an ingested email is never left unprocessed.
    republish-outstanding-events-on-restart: true
