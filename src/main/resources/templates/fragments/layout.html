<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="${title} + ' · NeoBuddy'">NeoBuddy</title>
  <meta name="description" content="NeoBuddy alerts you when your NeoID appears in a placement shortlist or offer email.">
  <!-- 4xx answers carry a message for the flash area, so htmx swaps them too. -->
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/htmx-2.0.11.min.js" defer></script>
</head>
<body>
<header th:fragment="header" class="site-header">
  <a class="brand" th:href="${signedIn} ? @{/dashboard} : @{/}">NeoBuddy</a>
  <nav th:if="${signedIn}" aria-label="Main">
    <a th:href="@{/dashboard}">Dashboard</a>
    <a th:href="@{/settings}">Settings</a>
    <form th:action="@{/logout}" method="post" class="inline"><button class="link" type="submit">Sign out</button></form>
  </nav>
  <nav th:if="${pendingConsent}" aria-label="Main">
    <form th:action="@{/logout}" method="post" class="inline"><button class="link" type="submit">Sign out</button></form>
  </nav>
</header>
<footer th:fragment="footer" class="site-footer">
  <a th:href="@{/privacy}">Privacy</a>
  <a th:href="@{/terms}">Terms</a>
  <span>NeoBuddy is run by students, not by the placement cell.</span>
</footer>
</body>
</html>
