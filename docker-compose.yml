# Local development only. Credentials default to throwaway values and can be
# overridden from the environment or an untracked .env file.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neobuddy}
      POSTGRES_USER: ${POSTGRES_USER:-neobuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neobuddy}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - neobuddy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  neobuddy-db:
