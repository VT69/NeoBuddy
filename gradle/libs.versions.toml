# Single place for every version. Libraries without a version are managed by the
# Spring Boot BOM or the Spring Modulith BOM, which are themselves pinned here.
# The only version outside this file is the foojay toolchain resolver in
# settings.gradle.kts, because settings plugins cannot read the catalog.
[versions]
java = "21"
spring-boot = "4.1.2"
spring-modulith = "2.1.2"
shedlock = "7.11.0"
spotless = "8.11.0"
google-java-format = "2.0.0"
tika = "4.2.0"
poi = "6.0.0"
excel-streaming-reader = "6.0.0"
pdfbox = "3.0.8"
jsoup = "1.24.1"
commons-csv = "1.14.1"
google-api-gmail = "v1-rev20261106-2.9.2"
google-auth = "1.57.0"
resilience4j = "2.4.0"
aws-sdk = "2.59.0"
wiremock = "3.13.2"

[libraries]
# BOMs
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }

# Spring Boot (versions from spring-boot-bom)
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-security-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-client" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# Database (versions from spring-boot-bom)
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# Spring Modulith (versions from spring-modulith-bom)
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-jpa = { module = "org.springframework.modulith:spring-modulith-starter-jpa" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

# ShedLock
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-provider-jdbc-template = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }

# Extraction (processing module)
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
excel-streaming-reader = { module = "com.github.pjfanning:excel-streaming-reader", version.ref = "excel-streaming-reader" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commons-csv" }

# Ingestion (Gmail)
google-api-gmail = { module = "com.google.apis:google-api-services-gmail", version.ref = "google-api-gmail" }
google-auth-oauth2-http = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "google-auth" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }

# Notification (ntfy rate limit, email through Amazon SES)
resilience4j-ratelimiter = { module = "io.github.resilience4j:resilience4j-ratelimiter", version.ref = "resilience4j" }
aws-sesv2 = { module = "software.amazon.awssdk:sesv2", version.ref = "aws-sdk" }

# Testing
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

# Testing (versions from spring-boot-bom)
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
