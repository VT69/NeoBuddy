# Local development against a PostgreSQL on localhost:5432, database "neobuddy".
# That can be a natively installed PostgreSQL or the optional one in docker-compose.yml.
# The fallback credentials are throwaway local-only values; override them with
# DB_URL / DB_USERNAME / DB_PASSWORD if your setup differs.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neobuddy}
    username: ${DB_USERNAME:neobuddy}
    password: ${DB_PASSWORD:neobuddy}

management:
  endpoint:
    health:
      show-details: always
