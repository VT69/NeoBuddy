# Settings for the "test" profile only.
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            # Placeholders; tests never reach Google.
            client-id: test-client-id.apps.googleusercontent.com
            client-secret: test-client-secret
neobuddy:
  encryption:
    # Not a secret: the bytes 0..31 in base64. Exists so tests can encrypt and decrypt.
    key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
  ingestion:
    # Tests poll by hand; a background poller would race with them on the shared database.
    enabled: false
  delivery:
    # Tests dispatch by hand; a background dispatcher would send other tests' alerts.
    enabled: false
  channels:
    email:
      # Nothing leaves the machine; tests that need SES replace its client with a mock.
      provider: log
